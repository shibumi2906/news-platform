[project]
name = "integrator-api"
version = "0.1.0"
description = "Integrator Admin API for sources, topics and versioned AI prompts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "common",
    "integrator-domain",
]

[tool.uv.sources]
common = { workspace = true }
integrator-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integrator_api"]
