[project]
name = "site-api"
version = "0.1.0"
description = "Site Admin API — Stage 1A: skeleton with health checks only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "common",
    "contracts",
    "site-domain",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
common = { workspace = true }
contracts = { workspace = true }
site-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_api"]
