[project]
name = "integrator-domain"
version = "0.1.0"
description = "Integrator-side domain models (source ingestion, canonical packages, delivery)"
requires-python = ">=3.12"
dependencies = [
    "common",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integrator_domain"]

[tool.uv.sources]
common = { workspace = true }
