[project]
name = "site-domain"
version = "0.1.0"
description = "Site-side domain models (incoming package ingestion)"
requires-python = ">=3.12"
dependencies = [
    "common",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/site_domain"]

[tool.uv.sources]
common = { workspace = true }
