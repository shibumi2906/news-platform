[project]
name = "contracts"
version = "0.1.0"
description = "Shared cross-service message contracts (source candidates, package envelope, ingestion)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
