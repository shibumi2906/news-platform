[project]
name = "common"
version = "0.1.0"
description = "Shared foundation utilities: config, logging, errors, ids, time, hashing, db, outbox contract, celery app factory"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "loguru>=0.7",
    "celery[redis]>=5.4",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
