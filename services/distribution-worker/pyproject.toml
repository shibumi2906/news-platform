[project]
name = "distribution-worker"
version = "0.1.0"
description = "Idempotent scheduled distribution worker with Telegram adapter"
requires-python = ">=3.12"
dependencies = [
    "common",
    "site-domain",
    "celery[redis]>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
common = { workspace = true }
site-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distribution_worker"]
