[project]
name = "processing-worker"
version = "0.1.0"
description = "AI Core worker: relevance, extraction, clustering and canonical article drafts"
requires-python = ">=3.12"
dependencies = [
    "common",
    "contracts",
    "integrator-domain",
    "celery[redis]>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv.sources]
common = { workspace = true }
contracts = { workspace = true }
integrator-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processing_worker"]
