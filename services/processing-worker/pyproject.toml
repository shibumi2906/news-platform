[project]
name = "processing-worker"
version = "0.1.0"
description = "Processing worker: builds canonical news packages from ingested source material (no AI step yet, docs/21 phase 3 not started)"
requires-python = ">=3.12"
dependencies = [
    "common",
    "contracts",
    "integrator-domain",
    "celery[redis]>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv.sources]
common = { workspace = true }
contracts = { workspace = true }
integrator-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processing_worker"]
