[project]
name = "source-worker"
version = "0.1.0"
description = "RSS source-worker: discover -> fetch -> normalize -> checkpoint (docs/05_SOURCE_CONNECTORS.md)"
requires-python = ">=3.12"
dependencies = [
    "common",
    "contracts",
    "integrator-domain",
    "celery[redis]>=5.4",
    "feedparser>=6.0",
    "httpx>=0.27",
    "playwright==1.50.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv.sources]
common = { workspace = true }
contracts = { workspace = true }
integrator-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_worker"]
