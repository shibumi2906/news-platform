[project]
name = "delivery-worker"
version = "0.1.0"
description = "Delivery worker: signs and delivers canonical news packages to subscribed Site instances (ADR-003, OD-04)"
requires-python = ">=3.12"
dependencies = [
    "common",
    "contracts",
    "integrator-domain",
    "celery[redis]>=5.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
common = { workspace = true }
contracts = { workspace = true }
integrator-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_worker"]
