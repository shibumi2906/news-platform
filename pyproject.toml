[project]
name = "news-platform-workspace"
version = "0.0.0"
description = "Universal AI-platform for entertainment news portals — monorepo root"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/python/*",
    "apps/*",
    "services/*",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.0",
    "httpx>=0.27",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated revision scripts: long auto-generated column definitions.
"migrations/*/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = [
    "packages/python/common/src",
    "packages/python/contracts/src",
    "packages/python/integrator-domain/src",
    "packages/python/site-domain/src",
    "apps/integrator-api/src",
    "apps/site-api/src",
    "services/source-worker/src",
    "services/processing-worker/src",
    "services/delivery-worker/src",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "services", "tests"]
asyncio_mode = "auto"
