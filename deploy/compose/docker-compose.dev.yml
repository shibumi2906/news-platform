name: news-platform-dev

services:
  postgres-integrator:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: news_platform
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: news_platform_integrator
    volumes:
      - postgres-integrator-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_platform -d news_platform_integrator"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-site:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: news_platform
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: news_platform_site
    ports:
      - "5433:5432"
    volumes:
      - postgres-site-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_platform -d news_platform_site"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate-integrator:
    build:
      context: ../..
      dockerfile: services/processing-worker/Dockerfile
    command: ["alembic", "-c", "migrations/integrator/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
    depends_on:
      postgres-integrator:
        condition: service_healthy

  migrate-site:
    build:
      context: ../..
      dockerfile: apps/site-api/Dockerfile
    command: ["alembic", "-c", "migrations/site/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-site:5432/news_platform_site
    depends_on:
      postgres-site:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: ../minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  integrator-api:
    build:
      context: ../..
      dockerfile: apps/integrator-api/Dockerfile
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000001
      INSTANCE_TYPE: integrator
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-change-me-admin-api-token}
      ADMIN_SESSION_KEYS: ${ADMIN_SESSION_KEYS:-dev-v1:development-session-signing-secret-over-32-characters}
      READINESS_REQUIRE_REDIS: "true"
    ports:
      - "8001:8000"
    depends_on:
      postgres-integrator:
        condition: service_healthy
      migrate-integrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  site-api:
    build:
      context: ../..
      dockerfile: apps/site-api/Dockerfile
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000002
      INSTANCE_TYPE: site
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-site:5432/news_platform_site
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-change-me-admin-api-token}
      ADMIN_SESSION_KEYS: ${ADMIN_SESSION_KEYS:-dev-v1:development-session-signing-secret-over-32-characters}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-development-admin-password}
      READINESS_REQUIRE_REDIS: "true"
      ALLOWED_HOSTS: site-api,localhost,127.0.0.1
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-change-me}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me}
      S3_BUCKET: ${SITE_MEDIA_BUCKET:-site-media}
      SUPABASE_DASHBOARD_URL: ${SUPABASE_DASHBOARD_URL:-}
      SUPABASE_DASHBOARD_KEY: ${SUPABASE_DASHBOARD_KEY:-}
      DASHBOARD_RETRY_BASE_SECONDS: ${DASHBOARD_RETRY_BASE_SECONDS:-30}
    ports:
      - "8002:8000"
    depends_on:
      postgres-site:
        condition: service_healthy
      migrate-site:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  public-web:
    build:
      context: ../..
      dockerfile: apps/public-web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Signal Desk}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
        NEXT_PUBLIC_PORTAL_THEME: ${NEXT_PUBLIC_PORTAL_THEME:-editorial}
    environment:
      HOSTNAME: 0.0.0.0
      SITE_API_URL: http://site-api:8000
      INTEGRATOR_API_URL: http://integrator-api:8000
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Signal Desk}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_PORTAL_THEME: ${NEXT_PUBLIC_PORTAL_THEME:-editorial}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      integrator-api:
        condition: service_healthy
      site-api:
        condition: service_healthy

  source-worker:
    build:
      context: ../..
      dockerfile: services/source-worker/Dockerfile
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000001
      INSTANCE_TYPE: integrator
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres-integrator:
        condition: service_healthy
      migrate-integrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  source-worker-beat:
    build:
      context: ../..
      dockerfile: services/source-worker/Dockerfile
    command: ["celery", "-A", "source_worker.celery_app", "beat", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000001
      INSTANCE_TYPE: integrator
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres-integrator:
        condition: service_healthy
      migrate-integrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  processing-worker:
    build:
      context: ../..
      dockerfile: services/processing-worker/Dockerfile
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000001
      INSTANCE_TYPE: integrator
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDERS: ${AI_PROVIDERS:-fake}
      AI_MAX_ATTEMPTS_PER_PROVIDER: ${AI_MAX_ATTEMPTS_PER_PROVIDER:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_INPUT_COST_PER_MILLION: ${OPENAI_INPUT_COST_PER_MILLION:-0}
      OPENAI_OUTPUT_COST_PER_MILLION: ${OPENAI_OUTPUT_COST_PER_MILLION:-0}
    depends_on:
      postgres-integrator:
        condition: service_healthy
      migrate-integrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  processing-worker-beat:
    build:
      context: ../..
      dockerfile: services/processing-worker/Dockerfile
    command: ["celery", "-A", "processing_worker.celery_app", "beat", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000001
      INSTANCE_TYPE: integrator
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDERS: ${AI_PROVIDERS:-fake}
      AI_MAX_ATTEMPTS_PER_PROVIDER: ${AI_MAX_ATTEMPTS_PER_PROVIDER:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_INPUT_COST_PER_MILLION: ${OPENAI_INPUT_COST_PER_MILLION:-0}
      OPENAI_OUTPUT_COST_PER_MILLION: ${OPENAI_OUTPUT_COST_PER_MILLION:-0}
    depends_on:
      postgres-integrator:
        condition: service_healthy
      migrate-integrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  delivery-worker:
    build:
      context: ../..
      dockerfile: services/delivery-worker/Dockerfile
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000001
      INSTANCE_TYPE: integrator
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres-integrator:
        condition: service_healthy
      migrate-integrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  delivery-worker-beat:
    build:
      context: ../..
      dockerfile: services/delivery-worker/Dockerfile
    command: ["celery", "-A", "delivery_worker.celery_app", "beat", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000001
      INSTANCE_TYPE: integrator
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-integrator:5432/news_platform_integrator
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres-integrator:
        condition: service_healthy
      migrate-integrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  distribution-worker:
    build:
      context: ../..
      dockerfile: services/distribution-worker/Dockerfile
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000002
      INSTANCE_TYPE: site
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-site:5432/news_platform_site
      REDIS_URL: redis://redis:6379/0
      DISTRIBUTION_SECRET_DEV_TELEGRAM: ${TELEGRAM_BOT_TOKEN:-}
      DISTRIBUTION_SECRET_FACEBOOK: ${FACEBOOK_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_INSTAGRAM: ${INSTAGRAM_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_TIKTOK: ${TIKTOK_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_X: ${X_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_YOUTUBE: ${YOUTUBE_ACCESS_TOKEN:-}
      TELEGRAM_BASE_URL: ${TELEGRAM_BASE_URL:-https://api.telegram.org}
      FACEBOOK_BASE_URL: ${FACEBOOK_BASE_URL:-https://graph.facebook.com/v22.0}
      TIKTOK_BASE_URL: ${TIKTOK_BASE_URL:-https://open.tiktokapis.com}
      X_BASE_URL: ${X_BASE_URL:-https://api.x.com}
      YOUTUBE_BASE_URL: ${YOUTUBE_BASE_URL:-https://www.googleapis.com}
    depends_on:
      postgres-site:
        condition: service_healthy
      migrate-site:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  distribution-worker-beat:
    build:
      context: ../..
      dockerfile: services/distribution-worker/Dockerfile
    command: ["celery", "-A", "distribution_worker.celery_app", "beat", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      APP_ENV: development
      INSTANCE_ID: 00000000-0000-0000-0000-000000000002
      INSTANCE_TYPE: site
      DATABASE_URL: postgresql+asyncpg://news_platform:change-me@postgres-site:5432/news_platform_site
      REDIS_URL: redis://redis:6379/0
      DISTRIBUTION_SECRET_DEV_TELEGRAM: ${TELEGRAM_BOT_TOKEN:-}
      DISTRIBUTION_SECRET_FACEBOOK: ${FACEBOOK_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_INSTAGRAM: ${INSTAGRAM_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_TIKTOK: ${TIKTOK_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_X: ${X_ACCESS_TOKEN:-}
      DISTRIBUTION_SECRET_YOUTUBE: ${YOUTUBE_ACCESS_TOKEN:-}
      TELEGRAM_BASE_URL: ${TELEGRAM_BASE_URL:-https://api.telegram.org}
      FACEBOOK_BASE_URL: ${FACEBOOK_BASE_URL:-https://graph.facebook.com/v22.0}
      TIKTOK_BASE_URL: ${TIKTOK_BASE_URL:-https://open.tiktokapis.com}
      X_BASE_URL: ${X_BASE_URL:-https://api.x.com}
      YOUTUBE_BASE_URL: ${YOUTUBE_BASE_URL:-https://www.googleapis.com}
    depends_on:
      postgres-site:
        condition: service_healthy
      migrate-site:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-integrator-data:
  postgres-site-data:
  minio-data:
