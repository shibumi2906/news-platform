name: news-platform-prod

x-integrator-production: &integrator-production
  APP_ENV: production
  INSTANCE_ID: ${INTEGRATOR_INSTANCE_ID:?set INTEGRATOR_INSTANCE_ID}
  INSTANCE_TYPE: integrator
  DATABASE_URL: postgresql+asyncpg://news_platform:${POSTGRES_INTEGRATOR_PASSWORD:?set POSTGRES_INTEGRATOR_PASSWORD}@postgres-integrator:5432/news_platform_integrator
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:?set API_ALLOWED_HOSTS}
  ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
  READINESS_REQUIRE_REDIS: "true"

x-site-production: &site-production
  APP_ENV: production
  INSTANCE_ID: ${SITE_INSTANCE_ID:?set SITE_INSTANCE_ID}
  INSTANCE_TYPE: site
  DATABASE_URL: postgresql+asyncpg://news_platform:${POSTGRES_SITE_PASSWORD:?set POSTGRES_SITE_PASSWORD}@postgres-site:5432/news_platform_site
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  ALLOWED_HOSTS: ${API_ALLOWED_HOSTS:?set API_ALLOWED_HOSTS}
  ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN}
  READINESS_REQUIRE_REDIS: "true"

services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN}
      SITE_API_DOMAIN: ${SITE_API_DOMAIN:?set SITE_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      public-web:
        condition: service_healthy
      site-api:
        condition: service_healthy
  postgres-integrator:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_INTEGRATOR_PASSWORD:?set POSTGRES_INTEGRATOR_PASSWORD}
  postgres-site:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SITE_PASSWORD:?set POSTGRES_SITE_PASSWORD}
  redis:
    ports: !reset []
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  migrate-integrator:
    environment: *integrator-production
  migrate-site:
    environment: *site-production
  integrator-api:
    environment:
      <<: *integrator-production
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      ADMIN_SESSION_KEYS: ${ADMIN_SESSION_KEYS:?set ADMIN_SESSION_KEYS}
      SITE_API_URL: http://site-api:8000
    ports: !reset []
  site-api:
    environment:
      <<: *site-production
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      ADMIN_SESSION_KEYS: ${ADMIN_SESSION_KEYS:?set ADMIN_SESSION_KEYS}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      SUPABASE_DASHBOARD_URL: ${SUPABASE_DASHBOARD_URL:-}
      SUPABASE_DASHBOARD_KEY: ${SUPABASE_DASHBOARD_KEY:-}
      DASHBOARD_RETRY_BASE_SECONDS: ${DASHBOARD_RETRY_BASE_SECONDS:-30}
    ports: !reset []
  source-worker:
    environment: *integrator-production
  source-worker-beat:
    environment: *integrator-production
  processing-worker:
    environment:
      <<: *integrator-production
      AI_PROVIDERS: ${AI_PROVIDERS:?set AI_PROVIDERS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  processing-worker-beat:
    environment:
      <<: *integrator-production
      AI_PROVIDERS: ${AI_PROVIDERS:?set AI_PROVIDERS}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  delivery-worker:
    environment: *integrator-production
  delivery-worker-beat:
    environment: *integrator-production
  distribution-worker:
    environment: *site-production
  distribution-worker-beat:
    environment: *site-production
  public-web:
    environment:
      NEXT_PUBLIC_WEB_URL: ${WEB_ORIGIN:?set WEB_ORIGIN}
      NEXT_PUBLIC_PORTAL_THEME: ${NEXT_PUBLIC_PORTAL_THEME:-editorial}
      SESSION_COOKIE_SECURE: "true"
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
