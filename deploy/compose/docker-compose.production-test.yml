services:
  postgres-integrator:
    ports: !override
      - "127.0.0.1:5434:5432"
  postgres-site:
    ports: !override
      - "127.0.0.1:5433:5432"
  redis:
    ports: !override
      - "127.0.0.1:6379:6379"
  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
  integrator-api:
    ports: !override
      - "127.0.0.1:8001:8000"
  site-api:
    ports: !override
      - "127.0.0.1:8002:8000"
  public-web:
    environment:
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_PORTAL_THEME: ${NEXT_PUBLIC_PORTAL_THEME:-editorial}
      SESSION_COOKIE_SECURE: "false"
